name: CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js (for frontend cache)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install docker-compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose

      - name: Start services via Docker Compose
        run: |
          docker-compose -f docker-compose.yml up -d
          echo "Waiting for Postgres and Keycloak to be ready..."
          # wait for Postgres
          until docker exec postgres_db pg_isready -U root -d StudyConnect; do
            sleep 5
          done
          # wait for Keycloak
          until curl -f http://localhost:8081/realms/master; do
            sleep 5
          done
          echo "Services are ready"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov requests

      - name: Run backend tests
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: StudyConnect
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          KEYCLOAK_SERVER_URL: http://localhost:8081/auth
          KEYCLOAK_CLIENT_ID: StudyConnect
          KEYCLOAK_REALM: StudyConnectRealm
          KEYCLOAK_CLIENT_SECRET: 2f8oWlRJM1edRQG0mHyCwEQhn95Sr4i7
          KEYCLOAK_ADMIN_CLIENT_ID: StudyConnectAdmin
          KEYCLOAK_ADMIN_CLIENT_SECRET: IDFYO9tn5QsTAexalTGzbkrHmjCWbFRO
        run: |
          pytest test_backend --cov=backend

      - name: Shutdown services
        run: docker-compose down

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build frontend
        working-directory: ui
        run: npm run build
