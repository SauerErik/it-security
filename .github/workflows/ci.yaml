name: CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Services (Keycloak & DB)
        run: docker compose up -d keycloak

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Wait for Keycloak
        run: |
          # Warten bis Keycloak auf Port 8081 antwortet (Timeout 120s)
          timeout 120s bash -c 'until curl -sf http://localhost:8081/realms/master > /dev/null; do sleep 5; done'

      - name: Show Keycloak Logs on Failure
        if: failure()
        run: docker compose logs keycloak

      - name: Run Tests
        env:
          KEYCLOAK_SERVER_URL: http://localhost:8081
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: StudyConnect
          # Werte passend zur keycloak-config/realm-export.json
          KEYCLOAK_REALM: StudyConnectRealm
          KEYCLOAK_CLIENT_ID: studyconnect-backend
          KEYCLOAK_CLIENT_SECRET: test-secret-key
          KEYCLOAK_ADMIN_CLIENT_ID: studyconnect-backend
          KEYCLOAK_ADMIN_CLIENT_SECRET: test-secret-key
        run: |
          pytest test_backend


  ui-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build

  # Integration Check
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, ui-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Compose Services
        run: docker compose build
