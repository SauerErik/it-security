name: CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: StudyConnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d StudyConnect"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      keycloak:
        image: quay.io/keycloak/keycloak:21.1.1
        ports:
          - 8081:8080
        env:
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: admin
        options: >-
          --health-cmd "curl -f http://localhost:8080/realms/master || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        command: start-dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Wait for services
        run: |
          echo "Waiting for Postgres and Keycloak..."
          sleep 20  # give services some time to be ready

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run backend tests
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: StudyConnect
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          KEYCLOAK_SERVER_URL: http://localhost:8081/auth
          KEYCLOAK_CLIENT_ID: StudyConnect
          KEYCLOAK_REALM: StudyConnectRealm
          KEYCLOAK_CLIENT_SECRET: 2f8oWlRJM1edRQG0mHyCwEQhn95Sr4i7
          KEYCLOAK_ADMIN_CLIENT_ID: StudyConnectAdmin
          KEYCLOAK_ADMIN_CLIENT_SECRET: IDFYO9tn5QsTAexalTGzbkrHmjCWbFRO
        run: |
          pytest test_backend --cov=backend

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build frontend
        working-directory: ui
        run: npm run build
